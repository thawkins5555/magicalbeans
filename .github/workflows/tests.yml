name: tests

# Runs the Python suites on both platforms this application ships to, plus
# a browser walk. See tests/README.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suites:
    name: suites (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # test_upgrade_from_previous.py needs the previous commit's history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ping and traceroute (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iputils-ping traceroute
          # test_nodepoll_e2e.py depends on ping actually working here, not just being absent.
          ping -c1 -W1 127.0.0.1

      - name: Install paramiko
        # The only third-party package this repository allows; without it,
        # five ConfigRX/SSH suites exit 77 and run_all.py reports SKIP.
        run: python -m pip install --disable-pip-version-check "paramiko<5"

      - name: Report the environment
        shell: bash
        run: |
          python -c "import sys, sqlite3; print('python', sys.version); print('sqlite', sqlite3.sqlite_version)"
          python -c "import importlib.util as u; print('paramiko', 'yes' if u.find_spec('paramiko') else 'no')"

      - name: Run the suites (Linux)
        if: runner.os == 'Linux'
        run: python3 tests/run_all.py

      - name: Run the suites (Windows)
        if: runner.os == 'Windows'
        # setup-python guarantees `python`, not reliably `python3`, on Windows.
        run: python tests/run_all.py

  ui-walk:
    name: browser walk (250 devices)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
      APP_PORT: "8443"
      CONTROL_PORT: "8099"
      FLEET_COUNT: "50"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ping and traceroute
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iputils-ping traceroute

      - name: Install Playwright
        run: |
          npm install -g playwright@1.56.1
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          sudo chown "$USER" "$PLAYWRIGHT_BROWSERS_PATH"
          npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Start the simulated fleet
        run: |
          # Binds real port 161 (privileged, hence sudo) so the unmodified poller can reach these devices.
          ulimit -n 8192
          mkdir -p demo/out
          sudo -E env "PATH=$PATH" python3 -u demo/fleet.py \
              --count "$FLEET_COUNT" --control-port "$CONTROL_PORT" \
              > demo/out/fleet.log 2>&1 &
          for i in $(seq 1 120); do
            grep -q listening demo/out/fleet.log && break
            sleep 1
          done
          grep -q listening demo/out/fleet.log || { echo "fleet never listened"; cat demo/out/fleet.log; exit 1; }
          curl -sf "http://127.0.0.1:$CONTROL_PORT/state" > /dev/null

      - name: Start the application
        run: |
          # demo/bin first on PATH so ping/traceroute are the scripted stand-ins; sudo binds the privileged trap/syslog/NetFlow ports once seeding enables them.
          mkdir -p demo/out/data
          sudo -E env "PATH=$PWD/demo/bin:$PATH" python3 -u -m netpath --headless \
              --host 127.0.0.1 --port "$APP_PORT" \
              --db "$PWD/demo/out/data/netpath.db" \
              > demo/out/app.log 2>&1 &
          for i in $(seq 1 180); do
            grep -q serving demo/out/app.log && break
            sleep 1
          done
          grep -q serving demo/out/app.log || { echo "app never served"; cat demo/out/app.log; exit 1; }

      - name: Check the forced password change on a pristine instance
        if: hashFiles('tests/ui/pristine_login.mjs') != ''
        run: |
          # Must run before seeding, which clears must_change; this step only observes.
          node tests/ui/pristine_login.mjs --base "http://127.0.0.1:$APP_PORT"

      - name: Seed devices, profiles and targets
        run: |
          # Writes demo/out/creds.txt (the walk's login) and clears the forced first-run password change.
          sudo chown -R "$USER" demo/out
          python3 demo/seed.py --base "http://127.0.0.1:$APP_PORT" \
              --count "$FLEET_COUNT" --out demo/out
          test -s demo/out/creds.txt

      - name: Let the first poll cycle complete
        run: sleep 60

      - name: Run the browser walk
        if: hashFiles('tests/ui/walk.mjs') != ''
        run: |
          mkdir -p demo/out/ui
          node tests/ui/walk.mjs --base "http://127.0.0.1:$APP_PORT" \
              --creds demo/out/creds.txt --out demo/out/ui --tag ci

      - name: Check a failed job leaves no unhandled rejection
        if: hashFiles('tests/ui/failed_job_no_pageerror.mjs') != ''
        run: |
          # Deliberately provokes a server refusal, so it cannot live in walk.mjs's own clean-run assertion.
          node tests/ui/failed_job_no_pageerror.mjs \
              --base "http://127.0.0.1:$APP_PORT" --creds demo/out/creds.txt

      - name: No browser walk in this tree
        if: hashFiles('tests/ui/walk.mjs') == ''
        run: |
          echo "::warning::tests/ui/walk.mjs is not present in this tree; the browser checks did not run."

      - name: Collect the logs
        if: always()
        run: |
          sudo chown -R "$USER" demo/out || true
          tail -n 200 demo/out/app.log   || true
          tail -n 60  demo/out/fleet.log || true

      - name: Upload screenshots and console output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-walk
          path: |
            demo/out/ui/
            demo/out/app.log
            demo/out/fleet.log
          if-no-files-found: ignore
          retention-days: 7
