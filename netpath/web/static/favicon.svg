<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="SappiWhere">
  <!-- A route through three hops: the one drawing this product is about.
       Colours are the application's own --bg/--accent/--ok, written out
       because a favicon has no stylesheet. Flat shapes only, so it stays
       legible at 16 px in a browser tab. -->
  <rect width="32" height="32" rx="6" fill="#0E1116"/>
  <path d="M6 22 L13 12 L20 20 L26 10" fill="none" stroke="#7AA2F7"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="6" cy="22" r="3.1" fill="#7AA2F7"/>
  <circle cx="13" cy="12" r="2.6" fill="#DCE3EA"/>
  <circle cx="20" cy="20" r="2.6" fill="#DCE3EA"/>
  <circle cx="26" cy="10" r="3.4" fill="#3FB950"/>
</svg>
