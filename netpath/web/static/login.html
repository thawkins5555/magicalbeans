<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — SappiWhere</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<!-- Applies the stored theme before the first frame; see boot.js. -->
<script src="/boot.js"></script>
</head>
<body class="login-page">
<main class="login-box">
  <!-- The mark is favicon.svg's route, drawn here with classes so it
       takes its colours from the theme rather than from hex. -->
  <h1 class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="mark-route" d="M6 22 L13 12 L20 20 L26 10"/><circle class="mark-start" cx="6" cy="22" r="3.1"/><circle class="mark-hop" cx="13" cy="12" r="2.6"/><circle class="mark-hop" cx="20" cy="20" r="2.6"/><circle class="mark-end" cx="26" cy="10" r="3.4"/></svg><span>SappiWhere</span></h1>

  <form id="login-form" autocomplete="on">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required
           aria-describedby="login-error">

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required aria-describedby="login-error">

    <p id="login-error" class="err" role="alert" hidden></p>
    <button id="login-button" type="submit" class="primary">Sign in</button>
  </form>
  <!-- Shown only on a fresh install nobody has signed in to (the server
       says so on /api/session). Until then a first-run administrator faced
       this form with no hint that a default account existed. -->
  <p id="login-note" class="hint" hidden>First time here? Sign in as
    <b>admin</b> with the password <b>admin</b>. You will be asked to choose a
    new password before anything else.</p>

</main>
<script src="/login.js" defer></script>
</body>
</html>
