<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — SappiWhere</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
<main class="login-box">
  <h1>SappiWhere</h1>

  <form id="login-form" autocomplete="on">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <p id="login-error" class="err" role="alert" hidden></p>
    <button id="login-button" type="submit" class="primary">Sign in</button>
  </form>
  <!-- Shown only on a fresh install nobody has signed in to (the server
       says so on /api/session). Until then a first-run administrator faced
       this form with no hint that a default account existed. -->
  <p id="login-note" class="hint" hidden>First time here? Sign in as
    <b>admin</b> with the password <b>admin</b>. You will be asked to choose a
    new password before anything else.</p>

</main>
<script src="/login.js" defer></script>
</body>
</html>
